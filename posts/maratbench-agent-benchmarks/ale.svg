<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Agents' Last Exam evaluation design</title>
  <desc id="desc">A task asks an agent to build a dashboard and export JSON. The dashboard is not inspected; the JSON artifact is checked by an executable validator against a hidden reference.</desc>
  <defs>
    <style>
      .paper{fill:#fff}.ink{fill:#1a1a1a}.soft{fill:#6b6b6b}.rule{stroke:#d4d4d4;stroke-width:2}.line{stroke:#6b6b6b;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.box{stroke:#d4d4d4;stroke-width:2;fill:none}.dash{stroke:#6b6b6b;stroke-width:2;stroke-dasharray:10 9;fill:none}.solid{fill:#1a1a1a}.inverse{fill:#fff}.arrowhead{fill:#6b6b6b}text{font-family:Charter,'Iowan Old Style',Georgia,'Times New Roman',serif}.title{font-size:48px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:28px}.prompt{font-size:25px}.code{font-size:23px}.small{font-size:21px}.result{font-size:34px;font-weight:700}.flow{marker-end:url(#arrow)}.brand{filter:none}
      @media(prefers-color-scheme:dark){.paper{fill:#141414}.ink{fill:#e8e8e8}.soft{fill:#909090}.rule,.box{stroke:#333}.line,.dash{stroke:#909090}.solid{fill:#e8e8e8}.inverse{fill:#141414}.arrowhead{fill:#909090}.brand{filter:invert(1)}}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path class="arrowhead" d="M0 0 9 4.5 0 9Z"/></marker>
  </defs>

  <rect class="paper" width="1200" height="720"/>
  <image class="brand" href="data:image/png;base64," x="60" y="48" width="64" height="64"/>
  <text class="ink title" x="145" y="96">Agents’ Last Exam</text>
  <line class="rule" x1="60" y1="135" x2="1140" y2="135"/>

  <rect class="box" x="60" y="265" width="275" height="175"/>
  <text class="soft label" x="90" y="310">Task asks for both</text>
  <text class="ink prompt" x="197.5" y="365" text-anchor="middle">Build dashboard</text>
  <text class="ink prompt" x="197.5" y="410" text-anchor="middle">Export JSON metrics</text>

  <line class="line flow" x1="335" y1="352.5" x2="400" y2="352.5"/>
  <rect class="box" x="410" y="302" width="155" height="101"/>
  <text class="ink label" x="487.5" y="346" text-anchor="middle">Agent</text>
  <text class="soft small" x="487.5" y="376" text-anchor="middle">finishes</text>

  <line class="line" x1="565" y1="352.5" x2="615" y2="352.5"/>
  <line class="line" x1="615" y1="255" x2="615" y2="485"/>
  <line class="line flow" x1="615" y1="255" x2="665" y2="255"/>
  <line class="line flow" x1="615" y1="485" x2="665" y2="485"/>

  <rect class="dash" x="675" y="205" width="265" height="100"/>
  <text class="ink body" x="807.5" y="250" text-anchor="middle">Dashboard state</text>
  <text class="soft small" x="807.5" y="282" text-anchor="middle">not inspected</text>
  <line class="line" x1="940" y1="255" x2="990" y2="255"/>
  <line class="line" x1="990" y1="238" x2="990" y2="272"/>

  <rect class="box" x="675" y="425" width="265" height="120"/>
  <text class="ink code" x="807.5" y="477" text-anchor="middle">dashboard_metrics.json</text>
  <text class="soft small" x="807.5" y="513" text-anchor="middle">the scored artifact</text>
  <line class="line flow" x1="940" y1="485" x2="985" y2="485"/>
  <rect class="solid" x="995" y="425" width="145" height="120"/>
  <text class="inverse label" x="1067.5" y="470" text-anchor="middle">Validator</text>
  <text class="inverse result" x="1067.5" y="522" text-anchor="middle">score</text>

  <text class="soft small" x="675" y="615">Only the JSON artifact crosses the grading boundary.</text>
</svg>
