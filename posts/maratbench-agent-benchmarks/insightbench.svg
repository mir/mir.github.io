<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">InsightBench evaluation design</title>
  <desc id="desc">A similarity table compares every reference insight with every predicted insight. The highest-scoring prediction in each reference row is selected, and those selected scores are averaged. One prediction can be selected more than once; extra predictions are not penalized.</desc>
  <defs>
    <style>
      .paper{fill:#fff}.ink{fill:#1a1a1a}.soft{fill:#6b6b6b}.rule{stroke:#d4d4d4;stroke-width:2}.line{stroke:#6b6b6b;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.box{stroke:#d4d4d4;stroke-width:2;fill:none}.solid{fill:#1a1a1a}.inverse{fill:#fff}.arrowhead{fill:#6b6b6b}text{font-family:Charter,'Iowan Old Style',Georgia,'Times New Roman',serif}.title{font-size:48px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:27px}.small{font-size:21px}.result{font-size:32px;font-weight:700}.flow{marker-end:url(#arrow)}
      @media(prefers-color-scheme:dark){.paper{fill:#141414}.ink{fill:#e8e8e8}.soft{fill:#909090}.rule,.box{stroke:#333}.line{stroke:#909090}.solid{fill:#e8e8e8}.inverse{fill:#141414}.arrowhead{fill:#909090}}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path class="arrowhead" d="M0 0 9 4.5 0 9Z"/></marker>
  </defs>

  <rect class="paper" width="1200" height="720"/>
  <text class="ink title" x="60" y="96">InsightBench</text>
  <line class="rule" x1="60" y1="135" x2="1140" y2="135"/>

  <text class="soft small" x="60" y="190">Similarity table · highest score in each row is selected</text>

  <rect class="box" x="60" y="215" width="760" height="340"/>
  <line class="rule" x1="60" y1="285" x2="820" y2="285"/>
  <line class="rule" x1="60" y1="375" x2="820" y2="375"/>
  <line class="rule" x1="60" y1="465" x2="820" y2="465"/>
  <line class="rule" x1="250" y1="215" x2="250" y2="555"/>
  <line class="rule" x1="440" y1="215" x2="440" y2="555"/>
  <line class="rule" x1="630" y1="215" x2="630" y2="555"/>

  <text class="soft label" x="155" y="258" text-anchor="middle">Reference</text>
  <text class="soft label" x="345" y="258" text-anchor="middle">Prediction P1</text>
  <text class="soft label" x="535" y="258" text-anchor="middle">Prediction P2</text>
  <text class="soft label" x="725" y="258" text-anchor="middle">Prediction P3</text>

  <text class="ink body" x="155" y="340" text-anchor="middle">Gold G1</text>
  <text class="ink label" x="345" y="330" text-anchor="middle">best · s1</text>
  <text class="soft small" x="535" y="330" text-anchor="middle">score</text>
  <text class="soft small" x="725" y="330" text-anchor="middle">score</text>

  <text class="ink body" x="155" y="430" text-anchor="middle">Gold G2</text>
  <text class="soft small" x="345" y="420" text-anchor="middle">score</text>
  <text class="ink label" x="535" y="420" text-anchor="middle">best · s2</text>
  <text class="soft small" x="725" y="420" text-anchor="middle">score</text>

  <text class="ink body" x="155" y="520" text-anchor="middle">Gold G3</text>
  <text class="soft small" x="345" y="510" text-anchor="middle">score</text>
  <text class="ink label" x="535" y="510" text-anchor="middle">best · s3</text>
  <text class="soft small" x="725" y="510" text-anchor="middle">score</text>

  <line class="line flow" x1="820" y1="385" x2="900" y2="385"/>
  <rect class="solid" x="910" y="305" width="230" height="160"/>
  <text class="inverse label" x="1025" y="350" text-anchor="middle">Insight score</text>
  <text class="inverse body" x="1025" y="397" text-anchor="middle">mean of s1, s2, s3</text>
  <text class="inverse small" x="1025" y="435" text-anchor="middle">ROUGE-1 or G-Eval</text>

  <text class="soft small" x="60" y="620">P2 can be selected twice. Extra predictions and analysis evidence do not reduce the score.</text>
</svg>
